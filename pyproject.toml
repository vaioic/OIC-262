[project]
name = "burton-lab-lugols-analysis"
version = "0.3.0"
description = "Pipeline to analyze color images of Lugol-stained C. elegans"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "numpy>=2.5.1",
    "oic-toolkit",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "tqdm>=4.70.0",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
module-root = ""

[tool.uv.sources]
oic-toolkit = { path = "../../Toolboxes/oic-toolkit", editable = true }
